[package]
name = "darkprince-vpn"
version = "1.1.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "gzip"] }
dp-engine = { path = "../engine" }
# Один запуск — одно приложение. Иначе повторный запуск вешает в трей ещё
# один значок, потому что приложение продолжает работать с закрытым окном.
tauri-plugin-single-instance = "2"
# Обновления с проверкой подписи: скачанный файл запускается с правами
# пользователя, и одного HTTPS для доверия к нему мало.
tauri-plugin-updater = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
