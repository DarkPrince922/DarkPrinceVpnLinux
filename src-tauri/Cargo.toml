[package]
name = "darkprince-vpn"
version = "1.1.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TLS — rustls, а не системный OpenSSL. С native-tls бинарник намертво
# привязывался к той версии libssl, что стояла на сборочной машине: пакет
# для Arch 1.3.6 собрался против OpenSSL 4 и не запускался там, где в системе
# ещё OpenSSL 3. Корневые сертификаты идут вместе с приложением.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
dp-engine = { path = "../engine" }
# Один запуск — одно приложение. Иначе повторный запуск вешает в трей ещё
# один значок, потому что приложение продолжает работать с закрытым окном.
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# Обновления с проверкой подписи: скачанный файл запускается с правами
# пользователя, и одного HTTPS для доверия к нему мало.
tauri-plugin-updater = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
