# Релиз: собирает приложение и выкладывает готовые файлы в Releases.
#
# Запустить можно двумя способами — повесить тег вида v1.0.0 либо нажать
# «Run workflow» и ввести версию руками. Во втором случае тег создаётся самим
# прогоном, из коммита, на котором его запустили.

name: Релиз

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия, например v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Собрать и опубликовать
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf desktop-file-utils

      - name: Скачать ядро и мост
        run: bash scripts/fetch-cores.sh src-tauri/core

      - name: Собрать
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@^2 build

      - name: Подготовить файлы
        id: files
        run: |
          version="${TAG#v}"
          mkdir -p out

          deb=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -1)
          app=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -1)
          [ -n "$deb" ] || { echo "не собрался .deb"; exit 1; }
          [ -n "$app" ] || { echo "не собрался AppImage"; exit 1; }

          cp "$deb" "out/DarkPrinceVPN-$version-amd64.deb"
          cp "$app" "out/DarkPrinceVPN-$version-x86_64.AppImage"
          chmod +x "out/DarkPrinceVPN-$version-x86_64.AppImage"

          cd out
          sha256sum * > checksums.txt
          cat checksums.txt

          {
            echo "Клиент DarkPrince VPN для Linux."
            echo
            echo "**Arch Linux** — сборка из исходников, файлы попадают под учёт pacman:"
            echo
            echo '```'
            echo "git clone https://github.com/DarkPrince922/DarkPrinceVpnLinux"
            echo "cd DarkPrinceVpnLinux/packaging && makepkg -si"
            echo '```'
            echo
            echo "**Любой дистрибутив** — AppImage, ничего ставить не нужно:"
            echo
            echo '```'
            echo "chmod +x DarkPrinceVPN-$version-x86_64.AppImage"
            echo "./DarkPrinceVPN-$version-x86_64.AppImage"
            echo '```'
            echo
            echo "**Debian и Ubuntu** — пакет .deb."
            echo
            echo "Для режима «весь трафик» нужны polkit и iproute2 — в большинстве"
            echo "систем они уже стоят. Режим системного прокси работает без них."
            echo
            echo "Контрольные суммы:"
            echo
            echo '```'
            cat checksums.txt
            echo '```'
          } > ../notes.md

      - name: Опубликовать
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" out/* \
            --target "${{ github.sha }}" \
            --title "DarkPrince VPN $TAG" \
            --notes-file notes.md
