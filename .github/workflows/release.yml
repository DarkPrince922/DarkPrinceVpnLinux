# Релиз: собирает приложение и выкладывает готовые файлы в Releases.
#
# Запустить можно двумя способами — повесить тег вида v1.0.0 либо нажать
# «Run workflow» и ввести версию руками. Во втором случае тег создаётся самим
# прогоном, из коммита, на котором его запустили.

name: Релиз

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия, например v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Собрать и опубликовать
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      TAG: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf desktop-file-utils

      - name: Скачать ядро и мост
        run: bash scripts/fetch-cores.sh src-tauri/core

      # Версия приложения должна совпасть с тегом: именно её оно сравнивает с
      # манифестом обновлений. Отстанет — апдейтер будет предлагать одно и то
      # же обновление по кругу.
      - name: Проставить версию
        run: bash scripts/set-version.sh "$TAG"

      - name: Собрать
        working-directory: src-tauri
        env:
          # Ключ подписи обновлений. Пока секрета нет, сборка идёт обычным
          # порядком, только рядом с AppImage не появится файл .sig — и шаг
          # с манифестом ниже честно скажет, что обновления не поедут.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@^2 build

      # Пакет для pacman собирается тем же PKGBUILD, которым его собирают у
      # себя: другой сборки для Arch не существует, и расходиться им нельзя.
      # Отсюда контейнер — makepkg и pacman есть только в самом Arch.
      - name: Собрать пакет для Arch
        run: |
          version="${TAG#v}"
          mkdir -p arch-pkg
          docker run --rm \
            -v "$PWD:/src:ro" -v "$PWD/arch-pkg:/out" \
            -e VERSION="$version" -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            archlinux:base-devel bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed git python

              # makepkg отказывается работать от root, поэтому собираем от
              # обычного пользователя, а pacman зовём через sudo без пароля.
              useradd -m build
              echo "build ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/build

              # Собираем из свежего клона, а не из копии рабочего каталога:
              # там уже лежит target/ от сборки на Ubuntu, и cargo принял бы
              # часть тех объектов за готовые. Заодно PKGBUILD пишет в клон, а
              # каталог прогона примонтирован только для чтения.
              git config --global --add safe.directory /src
              git clone --no-hardlinks /src /home/build/repo
              chown -R build:build /home/build/repo

              sudo -u build bash -euo pipefail -c "
                cd /home/build/repo
                # клон снят с коммита, а версию проставляет скрипт — в
                # склонированном дереве её ещё нет
                bash scripts/set-version.sh $VERSION
                cd packaging && makepkg --syncdeps --force --noconfirm
              "

              cp /home/build/repo/packaging/*.pkg.tar.zst /out/
              chown "$HOST_UID:$HOST_GID" /out/*.pkg.tar.zst
            '
          ls -lh arch-pkg

      - name: Подготовить файлы
        id: files
        run: |
          version="${TAG#v}"
          mkdir -p out

          deb=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -1)
          app=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -1)
          pkg=$(find arch-pkg -name '*.pkg.tar.zst' | head -1)
          [ -n "$deb" ] || { echo "не собрался .deb"; exit 1; }
          [ -n "$app" ] || { echo "не собрался AppImage"; exit 1; }
          [ -n "$pkg" ] || { echo "не собрался пакет для Arch"; exit 1; }

          cp "$deb" "out/DarkPrinceVPN-$version-amd64.deb"
          cp "$app" "out/DarkPrinceVPN-$version-x86_64.AppImage"
          cp "$pkg" "out/DarkPrinceVPN-$version-x86_64.pkg.tar.zst"
          chmod +x "out/DarkPrinceVPN-$version-x86_64.AppImage"

          # Манифест обновлений. Адрес ведёт на наш сайт, а не на GitHub: у
          # части пользователей он недоступен ровно тогда, когда обновление и
          # нужно. Имя файла на сайте без версии, поэтому ссылка постоянная.
          if [ -f "$app.sig" ]; then
            python3 - "$app.sig" "$version" > out/linux-x86_64.json <<'PY'
          import json, sys, datetime
          signature = open(sys.argv[1]).read().strip()
          print(json.dumps({
              "version": sys.argv[2],
              "notes": f"DarkPrince VPN {sys.argv[2]}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc)
                  .strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "linux-x86_64": {
                      "url": "https://dprince.online/downloads/DarkPrinceVPN.AppImage",
                      "signature": signature,
                  }
              },
          }, ensure_ascii=False, indent=2))
          PY
            echo "манифест обновлений собран"
          else
            echo "::warning::Нет секрета TAURI_SIGNING_PRIVATE_KEY — подписи нет, манифест не собран, обновления до пользователей не поедут"
          fi

          cd out
          sha256sum * > checksums.txt
          cat checksums.txt

          {
            echo "Клиент DarkPrince VPN для Linux."
            echo
            echo "**Arch Linux** — готовый пакет, ставится и удаляется через pacman:"
            echo
            echo '```'
            echo "sudo pacman -U DarkPrinceVPN-$version-x86_64.pkg.tar.zst"
            echo '```'
            echo
            echo "Собран тем же PKGBUILD, что лежит в репозитории. Кому нужен"
            echo "другой процессор или сборка из своих исходников:"
            echo
            echo '```'
            echo "git clone https://github.com/DarkPrince922/DarkPrinceVpnLinux"
            echo "cd DarkPrinceVpnLinux/packaging && makepkg -si"
            echo '```'
            echo
            echo "**Любой дистрибутив** — AppImage, ничего ставить не нужно:"
            echo
            echo '```'
            echo "chmod +x DarkPrinceVPN-$version-x86_64.AppImage"
            echo "./DarkPrinceVPN-$version-x86_64.AppImage"
            echo '```'
            echo
            echo "**Debian и Ubuntu** — пакет .deb."
            echo
            echo "Для режима «весь трафик» нужны polkit и iproute2 — в большинстве"
            echo "систем они уже стоят. Режим системного прокси работает без них."
            echo
            echo "Контрольные суммы:"
            echo
            echo '```'
            cat checksums.txt
            echo '```'
          } > ../notes.md

      - name: Опубликовать
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" out/* \
            --target "${{ github.sha }}" \
            --title "DarkPrince VPN $TAG" \
            --notes-file notes.md
