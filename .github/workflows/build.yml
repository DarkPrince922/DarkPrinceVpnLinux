name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          # свежий xray-core требует Go 1.26
          go-version: "1.26"
          cache: true

      - name: Проверка форматирования
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt не применён к: $unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Тесты
        # Часть тестов поднимает TUN-интерфейс и правит маршруты, поэтому
        # запускаем под sudo. DARKPRINCE_REQUIRE_ROOT_TESTS не даёт им тихо
        # пропуститься, если привилегий вдруг не окажется: пропуск в логе
        # выглядит как успех, и сборка была бы зелёной впустую.
        run: |
          sudo -E env "PATH=$PATH" DARKPRINCE_REQUIRE_ROOT_TESTS=1 \
            go test ./... -count=1 -v 2>&1 | tee test.log
          echo "── итог ──"
          grep -cE '^(=== RUN|--- PASS)' test.log
          if grep -q '^--- SKIP' test.log; then
            echo "::error::тесты пропускались, хотя не должны были"
            grep '^--- SKIP' test.log
            exit 1
          fi

      - name: Сборка
        run: go build -o darkprince .

      - uses: actions/upload-artifact@v4
        with:
          name: darkprince-linux-amd64
          path: darkprince
