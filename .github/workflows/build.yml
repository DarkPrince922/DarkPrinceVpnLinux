name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          # свежий xray-core требует Go 1.26
          go-version: "1.26"
          cache: true

      - name: Проверка форматирования
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt не применён к: $unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Тесты
        # часть тестов поднимает TUN-интерфейс и правит маршруты; без root
        # они пропускаются, поэтому запускаем под sudo
        run: sudo -E env "PATH=$PATH" go test ./... -count=1

      - name: Сборка
        run: go build -o darkprince .

      - uses: actions/upload-artifact@v4
        with:
          name: darkprince-linux-amd64
          path: darkprince
