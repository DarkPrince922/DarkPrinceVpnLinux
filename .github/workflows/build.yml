name: Сборка

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Проверить движок
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Тесты движка
        working-directory: engine
        run: cargo test

      # Разбор гостевой ссылки — чистая функция с кучей краевых случаев.
      # Node на runner'е уже есть, свой тест-раннер ему не нужен.
      - name: Тесты разбора ссылки
        run: node --test ui/guest.test.js

  app:
    name: Собрать приложение
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Собираем на 22.04 намеренно: пакет, собранный против свежих
      # системных библиотек, не встанет на систему постарше, а наоборот —
      # встанет. Для Arch это неважно, для Debian и Ubuntu важно.
      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf desktop-file-utils

      - name: Скачать ядро и мост
        run: bash scripts/fetch-cores.sh src-tauri/core

      - name: Собрать
        working-directory: src-tauri
        # Обычный CI проверяет приложение и пакеты, но не выпускает обновление.
        # Подписанные updater-артефакты создаёт только release.yml, где ключ
        # доступен из secrets.
        run: npx --yes @tauri-apps/cli@^2 build --config tauri.ci.conf.json

      - name: Проверить состав сборки
        run: |
          test -x src-tauri/target/release/darkprince-vpn || { echo "бинарник не собрался"; exit 1; }
          find src-tauri/target/release/bundle -type f \
            \( -name '*.deb' -o -name '*.AppImage' \) -printf '%f\t%s байт\n'

      - uses: actions/upload-artifact@v4
        with:
          name: DarkPrinceVPN-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
